name: Publish to PyPI and Docker Hub

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Needed for PyPI OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  docker-publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # --- DEBUG STEP ---
      - name: Debug secret availability
        run: |
          echo "Username length: ${#USER_VAL}"
          echo "Token length: ${#TOKEN_VAL}"
        env:
          USER_VAL: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN_VAL: ${{ secrets.DOCKERHUB_TOKEN }}
      # ------------------

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}