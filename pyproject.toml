[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "survival-simulation"
version = "0.1.0"
description = "Synthetic survival dataset generator supporting linear, non-linear, and non-PH scenarios."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Vincent" }
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scikit-survival>=0.17.0"
]

[project.scripts]
simulate-survival = "survival_simulation.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/survival-simulation"